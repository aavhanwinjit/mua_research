  retrofit: ^4.4.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dartz: ^0.10.1
  get_it: ^7.6.7
  injectable: ^2.4.4
  platform_device_id: ^1.0.1
  crypto: ^3.0.3
  pointycastle: ^3.7.4
  encrypt: ^5.0.3
  internet_connection_checker_plus: ^2.2.0
  get_storage: ^2.1.1
  safe_device: ^1.1.6
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  local_auth: ^2.1.8
  url_launcher: ^6.2.4
  shimmer: ^3.0.0
  # google_mlkit_text_recognition: ^0.11.0
  # google_mlkit_document_scanner: ^0.2.0
