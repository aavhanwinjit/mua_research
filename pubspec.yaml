  # cunning_document_scanner: ^1.2.3
  firebase_core: ^3.5.0
  firebase_crashlytics: ^4.1.2
  firebase_analytics: ^11.3.2
  path_provider: ^2.1.3
  open_file: ^3.3.2
  # crop_your_image: ^1.1.0
  image_cropper: ^8.0.1
  # image_cropping: ^0.0.14
  # file_picker: ^8.0.6
  pdf: ^3.11.1
  multiple_image_camera: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  # riverpod_generator: ^2.4.3
  riverpod_generator: ^3.0.0-dev.11
  retrofit_generator: ^8.2.1
  freezed: 2.5.0
  json_serializable: ^6.7.1
  injectable_generator: ^2.6.2
  flutter_lints: ^4.0.0
  icons_launcher: ^3.0.0

dependency_overrides:
  analyzer:
  meta: ^1.12.0

icons_launcher:
  image_path: "assets/images/launcher_icon/launcher_icon.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/launcher_icon/
    - assets/certificates/

  fonts:
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/Nunito_Sans/NunitoSans_10pt-Black.ttf
          weight: 900
        - asset: assets/fonts/Nunito_Sans/NunitoSans_10pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito_Sans/NunitoSans_10pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito_Sans/NunitoSans_10pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito_Sans/NunitoSans_10pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito_Sans/NunitoSans_10pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito_Sans/NunitoSans_10pt-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito_Sans/NunitoSans_10pt-ExtraLight.ttf
          weight: 200

    - family: Isidora Sans
      fonts:
        # - asset: assets/fonts/Isidora-Sans/isidorasans-black.otf
        #   weight: 900
        - asset: assets/fonts/Isidora-Sans/Isidora-Bold.otf
          weight: 700
        # - asset: assets/fonts/Isidora-Sans/isidorasans-semibold.otf
        #   weight: 600
        - asset: assets/fonts/Isidora-Sans/Isidora-Medium.otf
          weight: 500
